name: Release new version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment. `auto` derives it from the Changelog entries.'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto

permissions:
  contents: write # create GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          ref: main

      - name: Set up node.js
        uses: actions/setup-node@v3.3.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
      
      - name: Unit tests
        run: npm run test

      - name: Read latest release version from package.json
        uses: actions/github-script@v6
        id: read-latest-release-version
        with:
          script: |
            const { version } = require('./package.json')
            core.info(`Latest release version is ${version}`)
            core.setOutput('latestReleaseVersion', version)
      
      - name: Define next release version based on Changelog entries
        uses: actions/github-script@v6
        id: define-release-version
        env:
          BUMP: ${{ inputs.bump }}
        with:
          script: |
            const { defineReleaseVersion } = require('./.github/scripts/defineVersion.js')
            return defineReleaseVersion({core}, "${{ steps.read-latest-release-version.outputs.latestReleaseVersion }}", './CHANGELOG.md', process.env.BUMP)

      - name: Bump package.json and Changelog version
        run: |
          npm --no-git-tag-version version "${{ fromJson(steps.define-release-version.outputs.result) }}"
          npx kacl release

      - name: Commit and tag version bump
        run: |
          git config --global user.name 'Automated Release'
          git config --global user.email 'release-automation@bitmovin.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Bump version and update changelog"
          git tag -a "${{ fromJson(steps.define-release-version.outputs.result) }}" -m "v${{ fromJson(steps.define-release-version.outputs.result) }}"

      # `npm publish` runs the `prepack` script, which rebuilds the bundle from the
      # released source after the version bump above. `dist/js` is not in git, the
      # `files` field in package.json is what puts it into the tarball.
      # Authenticates via OIDC trusted publishing (needs npm >= 11.5.1) and adds provenance.
      - name: Publish to npm
        run: npm publish

      # Push only after a successful publish, so a failed publish leaves no version bump or tag on the remote.
      - name: Push version bump and tag
        run: |
          git push origin main
          git push origin "${{ fromJson(steps.define-release-version.outputs.result) }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ fromJson(steps.define-release-version.outputs.result) }}
